<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRV · Asistencia Domingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2534;
    --panel:#26324a;
    --panel-2:#2e3b56;
    --border:#414f6c;
    --orange:#f97316;
    --teal:#00d4aa;
    --red:#ef4444;
    --yellow:#eab308;
    --green:#16a34a;
    --text:#e6edf3;
    --text-muted:#8b949e;
    --blue-bg:#0f1c33;
    --blue-border:#25406e;
    --blue-input:#152645;
    --blue-accent:#5b9cf6;
    --blue-accent-2:#8fb8f7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito', sans-serif;
    padding:24px 16px 60px;
  }
  .container{
    max-width:900px;
    margin:0 auto;
  }

  /* ---------- Tarjetas de estadísticas (arriba de todo) ---------- */
  .top-fecha{
    text-align:center;
    color:var(--teal);
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:0.95rem;
    margin-bottom:16px;
  }
  .stats-cards{
    display:flex;
    gap:12px;
    margin-bottom:32px;
  }
  .stat-card{
    flex:1;
    border-radius:16px;
    padding:20px 8px;
    text-align:center;
  }
  .stat-card.stat-red{background:var(--red);}
  .stat-card.stat-yellow{background:var(--yellow);}
  .stat-card.stat-green{background:var(--green);}
  .stat-numero{
    font-size:2.6rem;
    font-weight:900;
    color:#fff;
    line-height:1;
  }
  .stat-label{
    margin-top:6px;
    font-size:0.78rem;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#fff;
  }

  /* ---------- Botón acceso planilla (ahora al final) ---------- */
  .planilla-wrap{
    text-align:center;
    margin-top:44px;
  }
  .btn-planilla{
    background:transparent;
    border:2px solid var(--teal);
    color:var(--teal);
    font-family:inherit;
    font-weight:700;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    font-size:0.9rem;
    transition:all .15s ease;
  }
  .btn-planilla:hover{
    background:var(--teal);
    color:#0d1117;
  }

  /* ---------- Botón "MI NOMBRE NO ESTÁ" (independiente, sobre POR CONFIRMAR) ---------- */
  .mi-nombre-wrap{
    text-align:center;
    margin-bottom:30px;
  }
  .btn-mi-nombre-standalone{
    font-family:inherit;
    background:transparent;
    border:2px dashed var(--red);
    color:var(--red);
    font-weight:800;
    font-size:1rem;
    padding:12px 26px;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .btn-mi-nombre-standalone:hover{
    background:rgba(239,68,68,0.12);
  }

  /* ---------- Secciones ---------- */
  .section{
    margin-bottom:36px;
  }
  .section-title-wrap{
    text-align:center;
    margin-bottom:20px;
  }
  .section-title{
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
    font-size:2.1rem;
    color:var(--text);
    text-shadow:0 2px 10px rgba(0,0,0,0.4);
  }
  .section-title.por-confirmar{color:var(--red);}
  .section-title.confirmados{color:var(--yellow);}
  .section-title.asistentes{color:var(--green);}
  .section-title-count{
    font-size:0.7em;
    font-weight:800;
    letter-spacing:0;
    color:var(--text-muted);
  }

  .grid-botones{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }

  .btn-nombre{
    font-family:inherit;
    font-weight:800;
    font-size:1rem;
    padding:8px 14px; /* más minimalista */
    border-radius:10px;
    cursor:pointer;
    border:1.5px solid transparent;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn-nombre:hover{
    transform:translateY(-2px);
  }

  .btn-nombre.por-confirmar{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .btn-nombre.por-confirmar:hover{filter:brightness(1.12);}

  .btn-nombre.confirmado{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#1a1a1a;
  }
  .btn-nombre.confirmado:hover{filter:brightness(1.08);}

  .btn-nombre.asistente{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }
  .btn-nombre.asistente:hover{filter:brightness(1.12);}

  .vacio{
    color:var(--text-muted);
    font-style:italic;
    font-size:0.95rem;
  }

  /* ---------- Recuadro "Ingresa tu nombre y apellido" (paleta azul) ---------- */
  .agregar-box{
    background:var(--blue-bg);
    border:1.5px dashed var(--blue-border);
    border-radius:16px;
    padding:24px 20px;
    margin-bottom:32px;
    text-align:center;
  }
  .agregar-box.oculto{
    display:none;
  }
  .agregar-box h3{
    margin:0 0 16px;
    font-size:1.5rem;
    color:var(--blue-accent-2);
    font-weight:900;
  }
  .agregar-form{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .agregar-form input{
    font-family:inherit;
    background:var(--blue-input);
    border:1.5px solid var(--blue-border);
    color:var(--text);
    padding:12px 16px;
    border-radius:12px;
    font-size:0.95rem;
    min-width:240px;
    outline:none;
  }
  .agregar-form input:focus{
    border-color:var(--blue-accent);
  }
  .agregar-botones{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .btn-agregar-confirmar{
    font-family:inherit;
    background:var(--orange);
    color:#0d1117;
    border:none;
    font-weight:800;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    font-size:0.95rem;
  }
  .btn-agregar-confirmar:hover{
    filter:brightness(1.08);
  }
  .btn-agregar-cancelar{
    font-family:inherit;
    background:var(--panel-2);
    color:var(--text);
    border:1px solid var(--border);
    font-weight:800;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    font-size:0.95rem;
  }
  .btn-agregar-cancelar:hover{
    background:var(--border);
  }

  /* ---------- Modal genérico de acción ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:16px;
  }
  .overlay.activo{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:26px;
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .modal p{
    font-size:1.15rem;
    font-weight:800;
    line-height:1.4;
    margin:0 0 20px;
  }
  .modal .error-msg{
    color:var(--red);
    font-size:0.85rem;
    margin-top:-10px;
    margin-bottom:14px;
    min-height:1em;
  }
  .modal input[type=password]{
    font-family:inherit;
    width:100%;
    background:var(--panel-2);
    border:1.5px solid var(--border);
    color:var(--text);
    padding:12px 14px;
    border-radius:10px;
    font-size:1rem;
    margin-bottom:16px;
    text-align:center;
    outline:none;
  }
  .modal input[type=password]:focus{border-color:var(--teal);}

  .modal-botones{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .btn-accion{
    font-family:inherit;
    font-weight:800;
    border:none;
    padding:13px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:0.98rem;
    width:100%;
  }
  .btn-accion.red{background:var(--red); color:#fff;}
  .btn-accion.yellow{background:var(--yellow); color:#1a1a1a;}
  .btn-accion.green{background:var(--green); color:#fff;}
  .btn-accion.gray{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}
  .btn-accion:hover{filter:brightness(1.1);}
  .btn-accion.gray:hover{filter:none; background:var(--border);}

  .cargando{
    text-align:center;
    color:var(--text-muted);
    padding:20px;
    font-style:italic;
  }

  @media (max-width:480px){
    .stat-numero{font-size:1.9rem;}
    .stat-label{font-size:0.62rem;}
    .section-title{font-size:1.5rem; letter-spacing:1.5px;}
    .btn-nombre{padding:7px 12px; font-size:0.92rem;}
  }
</style>
</head>
<body>

<div class="container">

  <div class="top-fecha" id="etiquetaFecha">cargando…</div>
  <div class="stats-cards">
    <div class="stat-card stat-red">
      <div class="stat-numero" id="statPorConfirmar">–</div>
      <div class="stat-label">POR CONFIRMAR</div>
    </div>
    <div class="stat-card stat-yellow">
      <div class="stat-numero" id="statConfirmados">–</div>
      <div class="stat-label">CONFIRMADOS</div>
    </div>
    <div class="stat-card stat-green">
      <div class="stat-numero" id="statAsistentes">–</div>
      <div class="stat-label">ASISTENTES</div>
    </div>
  </div>

  <div class="mi-nombre-wrap">
    <button class="btn-mi-nombre-standalone" id="btnMiNombre">+ MI NOMBRE NO ESTÁ</button>
  </div>

  <div class="section">
    <div class="section-title-wrap">
      <div class="section-title por-confirmar">POR CONFIRMAR <span class="section-title-count">(<span id="countPorConfirmar">0</span>)</span></div>
    </div>
    <div class="grid-botones" id="gridPorConfirmar">
      <div class="cargando">Cargando listado…</div>
    </div>
  </div>

  <div class="agregar-box oculto" id="agregarBox">
    <h3>Ingresa tu nombre y apellido</h3>
    <div class="agregar-form">
      <input
        type="text"
        id="inputNuevoNombre"
        placeholder="Tu nombre y apellido"
        maxlength="60"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
        name="crv-asistencia-nombre"
        data-lpignore="true"
        data-1p-ignore="true"
        data-bwignore="true"
        data-form-type="other">
    </div>
    <div class="agregar-botones">
      <button id="btnAgregarNuevo" class="btn-agregar-confirmar">Pasar a CONFIRMADO</button>
      <button id="btnAgregarCancelar" class="btn-agregar-cancelar">Cancelar</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title-wrap">
      <div class="section-title confirmados">CONFIRMADOS <span class="section-title-count">(<span id="countConfirmados">0</span>)</span></div>
    </div>
    <div class="grid-botones" id="gridConfirmados">
      <div class="cargando">Cargando confirmados…</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title-wrap">
      <div class="section-title asistentes">ASISTENTES <span class="section-title-count">(<span id="countAsistentes">0</span>)</span></div>
    </div>
    <div class="grid-botones" id="gridAsistentes">
      <div class="cargando">Cargando asistentes…</div>
    </div>
  </div>

  <div class="planilla-wrap">
    <button class="btn-planilla" id="btnPlanilla">📋 Acceder a la planilla</button>
  </div>

</div>

<!-- Modal genérico de acción (POR CONFIRMAR / CONFIRMADOS / ASISTENTES) -->
<div class="overlay" id="overlayAccion">
  <div class="modal">
    <p id="textoAccion"></p>
    <div class="modal-botones" id="botonesAccion"></div>
  </div>
</div>

<!-- Modal password planilla -->
<div class="overlay" id="overlayPassword">
  <div class="modal">
    <p>Ingresa la clave para acceder a la planilla</p>
    <input type="password" id="inputPassword" placeholder="Clave">
    <div class="error-msg" id="errorPassword"></div>
    <div class="modal-botones">
      <button class="btn-accion yellow" id="btnPasswordOk">Acceder</button>
      <button class="btn-accion gray" id="btnPasswordCancel">Cancelar</button>
    </div>
  </div>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2AfHoohtV2rTVVinmQGMNh64S9Lk7qMn2HLl7cYg1ItxaBtFuZ1t5IdvdUohReQkh/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1dmxU8xKI8DSfknbfFm1n639qSFMuwU8eQl8ullHjPGQ/edit';
const CLAVE_PLANILLA = 'CRVVAsistencia';
const AUTO_REFRESH_MS = 30000;

/* ============ FECHA PRÓXIMO DOMINGO ============ */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
                'agosto','septiembre','octubre','noviembre','diciembre'];

function getProximoDomingo(){
  const hoy = new Date();
  const dia = hoy.getDay(); // 0 = domingo
  const diasHasta = (7 - dia) % 7;
  const fecha = new Date(hoy);
  fecha.setDate(hoy.getDate() + diasHasta);
  fecha.setHours(0,0,0,0);
  return fecha;
}

function formatFechaEs(fecha){
  const dd = String(fecha.getDate()).padStart(2,'0');
  const mes = MESES[fecha.getMonth()];
  return `${dd} de ${mes}`;
}

function fechaISO(fecha){
  const y = fecha.getFullYear();
  const m = String(fecha.getMonth()+1).padStart(2,'0');
  const d = String(fecha.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

const proximoDomingo = getProximoDomingo();
const proximoDomingoISO = fechaISO(proximoDomingo);
document.getElementById('etiquetaFecha').textContent =
  `confirmados domingo ${formatFechaEs(proximoDomingo)}`;

/* ============ ORDEN ALFABÉTICO POR APELLIDO ============ */
function apellido(nombre){
  const partes = nombre.trim().split(/\s+/);
  return partes[partes.length - 1] || '';
}
function ordenarPorApellido(lista){
  return [...lista].sort((a, b) => apellido(a).localeCompare(apellido(b), 'es', { sensitivity: 'base' }));
}

/* ============ ESTADO ============ */
let listado = [];
let estadosPorNombre = {}; // nombre -> 'confirmado' | 'asistente'

function buscarEstado(nombre){
  if(estadosPorNombre[nombre]) return estadosPorNombre[nombre];
  const clave = Object.keys(estadosPorNombre).find(k => k.toLowerCase() === nombre.toLowerCase());
  return clave ? estadosPorNombre[clave] : null;
}

/* ============ CARGA DE DATOS ============ */
async function cargarDatos(){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=listar`);
    const data = await res.json();

    listado = data.listado || [];
    const registros = data.registros || [];

    estadosPorNombre = {};
    registros
      .filter(r => r.fecha === proximoDomingoISO)
      .forEach(r => { estadosPorNombre[r.nombre] = r.estado; });

    render();
  }catch(err){
    console.error('Error cargando datos', err);
  }
}

/* ============ RENDER ============ */
function render(){
  const porConfirmar = ordenarPorApellido(listado.filter(n => !buscarEstado(n)));
  const confirmados = ordenarPorApellido(listado.filter(n => buscarEstado(n) === 'confirmado'));
  const asistentes = ordenarPorApellido(listado.filter(n => buscarEstado(n) === 'asistente'));

  document.getElementById('statPorConfirmar').textContent = porConfirmar.length;
  document.getElementById('statConfirmados').textContent = confirmados.length;
  document.getElementById('statAsistentes').textContent = asistentes.length;
  document.getElementById('countPorConfirmar').textContent = porConfirmar.length;
  document.getElementById('countConfirmados').textContent = confirmados.length;
  document.getElementById('countAsistentes').textContent = asistentes.length;

  // ---------- POR CONFIRMAR ----------
  const gridPC = document.getElementById('gridPorConfirmar');
  gridPC.innerHTML = '';

  if(porConfirmar.length === 0){
    const vacio = document.createElement('div');
    vacio.className = 'vacio';
    vacio.textContent = 'No quedan personas por confirmar.';
    gridPC.appendChild(vacio);
  }else{
    porConfirmar.forEach(nombre => {
      const btn = document.createElement('button');
      btn.className = 'btn-nombre por-confirmar';
      btn.textContent = nombre;
      btn.onclick = () => abrirModalAccion(nombre, 'por_confirmar');
      gridPC.appendChild(btn);
    });
  }

  // ---------- CONFIRMADOS ----------
  const gridC = document.getElementById('gridConfirmados');
  gridC.innerHTML = '';
  if(confirmados.length === 0){
    gridC.innerHTML = '<div class="vacio">Aún no hay confirmados.</div>';
  }else{
    confirmados.forEach(nombre => {
      const btn = document.createElement('button');
      btn.className = 'btn-nombre confirmado';
      btn.textContent = nombre;
      btn.onclick = () => abrirModalAccion(nombre, 'confirmado');
      gridC.appendChild(btn);
    });
  }

  // ---------- ASISTENTES ----------
  const gridA = document.getElementById('gridAsistentes');
  gridA.innerHTML = '';
  if(asistentes.length === 0){
    gridA.innerHTML = '<div class="vacio">Aún no hay asistentes.</div>';
  }else{
    asistentes.forEach(nombre => {
      const btn = document.createElement('button');
      btn.className = 'btn-nombre asistente';
      btn.textContent = nombre;
      btn.onclick = () => abrirModalAccion(nombre, 'asistente');
      gridA.appendChild(btn);
    });
  }
}

/* ============ MODAL GENÉRICO DE ACCIÓN ============ */
const overlayAccion = document.getElementById('overlayAccion');
const textoAccion = document.getElementById('textoAccion');
const botonesAccion = document.getElementById('botonesAccion');

function abrirModalAccion(nombre, estadoActual){
  const opciones = [];

  if(estadoActual === 'por_confirmar'){
    opciones.push({ label: 'Pasar a CONFIRMADOS', color: 'yellow', accion: () => cambiarEstado(nombre, 'confirmado') });
  } else if(estadoActual === 'confirmado'){
    opciones.push({ label: 'Pasar a ASISTENTE', color: 'green', accion: () => cambiarEstado(nombre, 'asistente') });
    opciones.push({ label: 'Volver a POR CONFIRMAR', color: 'red', accion: () => quitarRegistro(nombre) });
  } else if(estadoActual === 'asistente'){
    opciones.push({ label: 'Volver a CONFIRMADOS', color: 'yellow', accion: () => cambiarEstado(nombre, 'confirmado') });
  }

  opciones.push({ label: 'Cancelar', color: 'gray', accion: null });

  textoAccion.textContent = nombre;
  botonesAccion.innerHTML = '';
  opciones.forEach(op => {
    const btn = document.createElement('button');
    btn.className = `btn-accion ${op.color}`;
    btn.textContent = op.label;
    btn.onclick = () => {
      cerrarModalAccion();
      if(op.accion) op.accion();
    };
    botonesAccion.appendChild(btn);
  });

  overlayAccion.classList.add('activo');
}

function cerrarModalAccion(){
  overlayAccion.classList.remove('activo');
}

/* ============ ACCIONES CONTRA EL BACKEND ============ */
async function cambiarEstado(nombre, nuevoEstado){
  estadosPorNombre[nombre] = nuevoEstado;
  render();

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'cambiarEstado', nombre, fecha: proximoDomingoISO, estado: nuevoEstado })
    });
  }catch(err){
    console.error('Error cambiando estado', err);
  }
  cargarDatos();
}

async function quitarRegistro(nombre){
  delete estadosPorNombre[nombre];
  render();

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'quitarRegistro', nombre, fecha: proximoDomingoISO })
    });
  }catch(err){
    console.error('Error quitando registro', err);
  }
  cargarDatos();
}

/* ============ AGREGAR NUEVO NOMBRE ============ */
document.getElementById('btnAgregarNuevo').onclick = async () => {
  const input = document.getElementById('inputNuevoNombre');
  const nombre = input.value.trim();
  if(!nombre) return;

  input.value = '';
  if(!listado.some(n => n.toLowerCase() === nombre.toLowerCase())){
    listado = [...listado, nombre];
  }
  estadosPorNombre[nombre] = 'confirmado';
  document.getElementById('agregarBox').classList.add('oculto');
  render();

  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'agregarNuevo', nombre, fecha: proximoDomingoISO })
    });
  }catch(err){
    console.error('Error agregando nombre', err);
  }
  cargarDatos();
};

document.getElementById('inputNuevoNombre').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('btnAgregarNuevo').click();
});

document.getElementById('btnAgregarCancelar').onclick = () => {
  document.getElementById('inputNuevoNombre').value = '';
  document.getElementById('agregarBox').classList.add('oculto');
};

document.getElementById('btnMiNombre').onclick = toggleAgregarBox;

function toggleAgregarBox(){
  const box = document.getElementById('agregarBox');
  box.classList.toggle('oculto');
  if(!box.classList.contains('oculto')){
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => document.getElementById('inputNuevoNombre').focus(), 300);
  }
}

/* ============ MODAL PASSWORD PLANILLA ============ */
const overlayPassword = document.getElementById('overlayPassword');
const inputPassword = document.getElementById('inputPassword');
const errorPassword = document.getElementById('errorPassword');

document.getElementById('btnPlanilla').onclick = () => {
  inputPassword.value = '';
  errorPassword.textContent = '';
  overlayPassword.classList.add('activo');
  setTimeout(() => inputPassword.focus(), 50);
};

document.getElementById('btnPasswordCancel').onclick = () => {
  overlayPassword.classList.remove('activo');
};

document.getElementById('btnPasswordOk').onclick = verificarPassword;
inputPassword.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') verificarPassword();
});

function verificarPassword(){
  if(inputPassword.value === CLAVE_PLANILLA){
    overlayPassword.classList.remove('activo');
    window.open(SHEET_URL, '_blank');
  }else{
    errorPassword.textContent = 'Clave incorrecta';
  }
}

/* ============ INIT ============ */
cargarDatos();
setInterval(cargarDatos, AUTO_REFRESH_MS);
</script>

</body>
</html>
